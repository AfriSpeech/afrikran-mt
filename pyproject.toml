[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AfriKrane-MT"
version = "0.1.0"
description = "Pan-African Machine Translation across 693 Languages with Preserved Noun Phrasing & Contextual Lexical Disambiguation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ghana NLP & AfriSpeech", email = "info@ghananlp.org" }]
keywords = ["machine-translation", "african-languages", "nlp", "llm", "gloss-mt", "gemma", "transformers"]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "spacy>=3.7.0",
    "pyarrow>=14.0.0",
    "datasets>=2.18.0",
]

[project.optional-dependencies]
align = [
    "awesome-align>=0.1.7",
]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["afrikrane*"]

